const qnMat=(s,cut)=>new THREE.ShaderMaterial({depthWrite:true,uniforms:{uS:{value:s*Math.min(devicePixelRatio,2)},uDark:(window.PTD=window.PTD||{value:0}),uR:{value:3.3},uCut:{value:cut?1:0}},
 vertexShader:'attribute vec3 col;varying vec3 vc;varying float vk;uniform float uS;uniform float uR;void main(){vc=col;vec4 mv=modelViewMatrix*vec4(position,1.);vec4 o=modelViewMatrix*vec4(0.,0.,0.,1.);vk=clamp((o.z-mv.z)/uR*.5+.5,0.,1.);gl_PointSize=uS*(30./-mv.z);gl_Position=projectionMatrix*mv;}',
 fragmentShader:'varying vec3 vc;varying float vk;uniform float uDark;uniform float uCut;void main(){float r=length(gl_PointCoord-.5);if(r>.5)discard;if(uCut>.5&&vk<.5)discard;vec3 c=vc;if(uDark<.5)c=pow(vc,vec3(1.5))*.9;c*=(.65+.35*(1.-r*2.))*mix(1.,.45,vk);gl_FragColor=vec4(c,1.);}'});
/* fast exact sampler: radial from inverse CDF of r^2 R^2, angle by rejection on |Y|^2 */
function qnSample(n,l,m,N,ext){const M=1500,cdf=new Float32Array(M+1),Rr=r=>{const rho=2*r/n;return Math.pow(rho,l)*Math.exp(-rho/2)*Lg(n-l-1,2*l+1,rho)};let acc=0,Pm=1e-12;
 for(let i=1;i<=M;i++){const r=ext*(i-.5)/M,v=r*r*Rr(r)**2;if(v>Pm)Pm=v;acc+=v;cdf[i]=acc}for(let i=1;i<=M;i++)cdf[i]/=acc;
 const u=[0,0,0],dir=()=>{let x,y,z,q;do{x=Math.random()*2-1;y=Math.random()*2-1;z=Math.random()*2-1;q=x*x+y*y+z*z}while(q>1||q<1e-4);q=Math.sqrt(q);u[0]=x/q;u[1]=y/q;u[2]=z/q};
 let Ym=0;for(let i=0;i<4000;i++){dir();Ym=Math.max(Ym,Math.abs(Yp(l,m,u[0],u[1],u[2])))}Ym*=1.05;
 const P=new Float32Array(N*3),S=new Int8Array(N),T=new Float32Array(N);let k=0,t=0;
 while(k<N&&t<N*80){t++;dir();const y=Yp(l,m,u[0],u[1],u[2]);if(Math.random()*Ym*Ym>y*y)continue;
  const q=Math.random();let lo=0,hi=M;while(hi-lo>1){const mid=(lo+hi)>>1;if(cdf[mid]<q)lo=mid;else hi=mid}
  const r=ext*(hi-1+Math.random())/M,rr=Rr(r);P[3*k]=u[0]*r;P[3*k+1]=u[1]*r;P[3*k+2]=u[2]*r;S[k]=rr*y>0?1:-1;T[k]=Math.pow(Math.min(1,r*r*rr*rr/Pm),.6);k++}
 return{P,S,T,k}}
function qnBuild(){clearInterval(eT);clear2();grp.rotation.x=-Math.PI/2;const{n,l,m,N,nuc,den,cut,hue}=QN,ext=extent(n,l),sc=3.3/ext,nm=`${n}${NM[l]}`+(l?`<sub>${PN[l][m+l]}</sub>`:'');

 const o=qnSample(n,l,m,N,ext),k=o.k,pos=new Float32Array(k*3),col=new Float32Array(k*3),HUE=[[.72,.9,.12],[.98,.62,.05],[.05,.72,.9]];
 for(let i=0;i<k;i++){pos[3*i]=o.P[3*i]*sc;pos[3*i+1]=o.P[3*i+1]*sc;pos[3*i+2]=o.P[3*i+2]*sc;col.set(den?heat(o.T[i]):hue>2?(o.S[i]>0?[.88,.48,.35]:[.36,.61,.84]):HUE[hue],3*i)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('col',new THREE.BufferAttribute(col,3));const P=new THREE.Points(g,qnMat(.75,cut));P.frustumCulled=false;grp.add(P);
 if(nuc)grp.add(new THREE.Mesh(new THREE.SphereGeometry(.12,16,12),new THREE.MeshStandardMaterial({color:0xd62839,emissive:0xd62839,emissiveIntensity:.5})));
 cam.position.set(0,1.5,13);HOME.copy(cam.position);ctl.target.set(0,0,0);ctl.maxDistance=40;ctl.update();req()}

const TEACH={
  atom:[{title:'The Quantum Model',body:'Electrons exist as probability clouds described by ψ(r,θ,φ). Each dot is a possible electron position.',formula:'ψ = Rₙₗ(r) · Yₗᵐ(θ,φ)'},{title:'Quantum Numbers',body:'n = shell size, l = orbital shape, m = orientation. Together they define every orbital.',formula:'n≥1 0≤l≤n−1 −l≤m≤l'},{title:'Nodes',body:'Nodes are surfaces of zero probability. Radial nodes = n−l−1. Angular nodes = l. Total nodes = n−1.',formula:'Total nodes = n − 1'},{title:'Probability Density',body:'Denser dot regions = higher probability. We sample by rejection: generate random (r,θ,φ) and keep with probability |ψ|².',formula:'P = |ψ|² · r² sinθ'}],
  orbital:[{title:'s Orbitals (l = 0)',body:'1s is a perfect sphere. 2s has 1 radial node. 3s has 2 radial nodes. All s orbitals have no angular dependence.',formula:'Angular nodes = 0 Radial nodes = n−1'},{title:'p Orbitals (l = 1)',body:'Dumbbell shape. px, py, pz are identical but perpendicular. Orange lobe = positive phase, blue = negative.',formula:'Angular nodes = 1 Three orientations: x, y, z'},{title:'d Orbitals (l = 2)',body:'Five d orbitals. dz² = torus + axial lobes. dx²−y² = 4 lobes on axes. dxy/dxz/dyz = 4 lobes between axes.',formula:'Angular nodes = 2 Five orientations'},{title:'Phase & Bonding',body:'Phase determines overlap. Same phase = constructive → bonding MO. Opposite phase = destructive → antibonding.',formula:'σ bond: head-on same-phase overlap'}],
  vsepr:[{title:'VSEPR Theory',body:'Valence Shell Electron Pair Repulsion: electron pairs maximize separation. Lone pairs occupy more space, compressing angles.',formula:'Steric Number = Bond Pairs + Lone Pairs'},{title:'Core Geometries',body:'SN2=Linear(180°), SN3=Trig.planar(120°), SN4=Tetrahedral(109.5°), SN5=TBP(90/120°), SN6=Octahedral(90°), SN7=PBP(72/90°)',formula:'LP−LP > LP−BP > BP−BP'},{title:'Lone Pair Effect',body:'H₂O: SN=4, 2 LP → bent at 104.5°. NH₃: SN=4, 1 LP → trigonal pyramidal at 107°. Each LP compresses ~2.5°.',formula:'Extra LP repulsion → smaller angle'},{title:'Wedge-Dash Notation',body:'Filled wedge (▶) = bond toward viewer. Dashed wedge (- - -) = bond away. Solid line = in plane.',formula:'Used to show 3D structure in 2D'}],
  hyb:[{title:'Hybridization Types',body:'sp (SN=2): 2 orbitals at 180°. sp² (SN=3): 3 orbitals at 120°. sp³ (SN=4): 4 orbitals at 109.5°. sp³d (SN=5): 5 at 90/120°. sp³d² (SN=6): 6 at 90°.',formula:'SN determines hybridization'},{title:'Why Hybridize?',body:'Carbon ground state has only 2 unpaired e⁻ but forms 4 equal bonds. Atomic orbitals mix to create equal hybrid orbitals.',formula:'C: 1s² 2s² 2p² → sp³: 4 equal orbitals'},{title:'σ vs π Bonds',body:'σ bond: head-on overlap. Every single bond = 1σ. π bond: side-on p overlap. Double = 1σ+1π. Triple = 1σ+2π.',formula:'Double = 1σ+1π Triple = 1σ+2π'},{title:'Counting in C₂H₄',body:'Ethylene: each C is sp². σ = C−C + 4 C−H = 5σ. Unhybridized p orbitals form 1π bond.',formula:'sp² C: 3σ bonds + 1 p orbital for π'}],
  ox:[{title:'What is Oxidation State?',body:'The hypothetical charge if all bonds were fully ionic. Used to track electron transfer in redox.',formula:'Σ(OS × atom count) = overall charge'},{title:'Priority Rules',body:'1) Pure element = 0. 2) F = −1. 3) Group 1 = +1. 4) Group 2 = +2. 5) H = +1 (−1 in hydrides). 6) O = −2.',formula:'Higher electronegativity → more negative OS'},{title:'Solving by Algebra',body:'Fix all known elements. Set unknown = x. Write sum equation = overall charge. Solve for x.',formula:'H₂SO₄: 2(+1)+x+4(−2)=0 → S=+6'},{title:'Special Cases',body:'Peroxides: O=−1 (H₂O₂). Superoxides: O=−½ (KO₂). Metal hydrides: H=−1 (NaH).',formula:'KMnO₄: +1+x+4(−2)=0 → Mn=+7'}],
  mb:[{title:'Structure Databases',body:'Type a SMILES string. A parser builds the bond graph, then geometry, hybridization and oxidation states are all derived from it — no per-molecule tables.',formula:'SMILES → graph → VSEPR slots → force field'},{title:'Force-Field Relaxation',body:'After building the bond network, a simplified molecular mechanics optimizes geometry: bond stretching, angle bending, van der Waals repulsion.',formula:'E = Σk_bond(r−r₀)² + Σk_angle(θ−θ₀)²'},{title:'What You Can Build',body:'Alkanes, alkenes, alkynes, alcohols, carboxylic acids, aldehydes, amines, nitriles, haloalkanes, common ions, oxoacids, noble gas compounds.',formula:'Type a SMILES and press Build'},{title:'Reading the Structure',body:'Each atom = sphere colored by CPK (C=grey, O=red, N=blue, S=yellow, Cl=green). Bonds = grey cylinders. Double/triple bonds show parallel cylinders.',formula:'CPK colors: standard chemistry convention'}],
  organic:[{title:'Carbon Hybridization',body:'C with 4 single bonds = sp³ (tetrahedral, 109.5°). C with 1 double bond = sp² (trigonal planar, 120°). C with 1 triple bond = sp (linear, 180°).',formula:'Bond count determines hybridization'},{title:'Alkanes (CₙH₂ₙ₊₂)',body:'Only C-C and C-H single bonds. All carbons sp³. Maximum hydrogen. General formula CₙH₂ₙ₊₂.',formula:'Saturation rule: all single bonds'},{title:'Alkenes (CₙH₂ₙ)',body:'At least one C=C double bond. Carbons in C=C are sp² (120°). One π bond from unhybridized p orbital.',formula:'One degree of unsaturation per C=C'},{title:'Alkynes (CₙH₂ₙ₋₂)',body:'At least one C≡C triple bond. Carbons in C≡C are sp (180°). Two π bonds from two unhybridized p orbitals.',formula:'Two degrees of unsaturation per C≡C'}],
